version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: hg-procedures-db
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-hg_procedures}
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "5432:5432"
    networks:
      - hg-network
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: hg-procedures-backend
    environment:
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=${DATABASE_USER:-postgres}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-postgres}
      - DATABASE_NAME=${DATABASE_NAME:-hg_procedures}
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      - PORT=3001
    volumes:
      - ./uploads:/app/uploads
    ports:
      - "3001:3001"
    networks:
      - hg-network
    depends_on:
      - postgres
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    container_name: hg-procedures-frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://31.97.86.227:3001
    ports:
      - "3000:3000"
    networks:
      - hg-network
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  hg-network:
    driver: bridge
